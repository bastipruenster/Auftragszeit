<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Auftragszeit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Auftragszeit-Rechner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #101828;
      font-size: 16px;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }
    h1 { font-size: 24px; margin: 10px 0 4px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    p { color: #667085; margin-top: 0; }
    .card {
      background: white;
      border: 1px solid #d0d5dd;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(16,24,40,0.06);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .people {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .person {
      border: 1px solid #d0d5dd;
      border-radius: 14px;
      padding: 12px;
      background: #fcfcfd;
    }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    input {
      width: 100%;
      min-height: 52px;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 18px;
      background: white;
    }
    input:focus {
      outline: 3px solid rgba(37,99,235,0.22);
      border-color: #2563eb;
    }
    .small { font-size: 13px; color: #667085; margin-top: 5px; }
    .row { margin-bottom: 10px; }
    .pauseBlock {
      border-top: 1px solid #d0d5dd;
      padding-top: 10px;
      margin-top: 10px;
    }
    .pauseTitle {
      font-weight: bold;
      margin-bottom: 8px;
      color: #344054;
    }
    button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 12px;
    }
    button:active {
      background: #1d4ed8;
      transform: translateY(1px);
    }
    .result {
      display: none;
      padding: 14px;
      border-radius: 14px;
      background: #ecfdf3;
      border: 1px solid #abefc6;
      color: #067647;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      line-height: 1.45;
    }
    .error {
      display: none;
      padding: 12px;
      border-radius: 12px;
      background: #fef3f2;
      border: 1px solid #fecdca;
      color: #b42318;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .note {
      margin-top: 6px;
      color: #067647;
      font-weight: bold;
      min-height: 18px;
    }
    .decimal {
      margin-top: 8px;
      padding: 8px;
      border-radius: 10px;
      background: #f2f4f7;
      font-weight: bold;
      line-height: 1.45;
    }
    .calcBox { display: none; }
    .step {
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      background: white;
      line-height: 1.45;
    }
    .step strong { display: block; }
    .appHint {
      font-size: 13px;
      color: #475467;
      background: #eff8ff;
      border: 1px solid #b2ddff;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 1050px) {
      .people { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 650px) {
      .wrap { padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
      h1 { font-size: 22px; }
      .grid, .people { grid-template-columns: 1fr; }
      input { font-size: 20px; min-height: 56px; }
      button {
        position: sticky;
        bottom: 10px;
        z-index: 10;
        box-shadow: 0 8px 18px rgba(37,99,235,0.28);
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Auftragszeit-Rechner</h1>
    <p>Mit 4 Personen, eigener Pause pro Person, Dezimalzeit und Anzeige in Stunden/Minuten.</p>
    <div class="appHint">Installierbar als Handy-App: im Browser teilen und „Zum Home-Bildschirm“ wählen.</div>

    <section class="card">
      <div class="grid">
        <div>
          <label for="auftrag">Auftragszeit gesamt in Stunden</label>
          <input id="auftrag" type="text" inputmode="decimal" value="3,55" placeholder="z. B. 3,55">
          <div class="small">Komma oder Punkt möglich. 3,55 h = 3 h 33 min.</div>
        </div>
        <div>
          <label for="stueck">Stückzahl</label>
          <input id="stueck" type="number" inputmode="numeric" min="1" value="20">
          <div class="small">Wird für die Zeit pro Stück angezeigt.</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="people" id="peopleBox"></div>
    </section>

    <button id="calcBtn" type="button">Berechnen</button>

    <div id="error" class="error"></div>
    <div id="result" class="result"></div>

    <section id="calcBox" class="card calcBox">
      <h2>Rechenweg</h2>
      <div id="steps"></div>
    </section>
  </main>

  <script>
    function buildPeople() {
      var box = document.getElementById("peopleBox");
      for (var i = 1; i <= 4; i++) {
        var div = document.createElement("div");
        div.className = "person";
        div.innerHTML =
          "<h2>Person " + i + "</h2>" +
          "<div class='row'><label for='p" + i + "start'>Startzeit</label><input id='p" + i + "start' type='time' value=''></div>" +
          "<div class='row'><label for='p" + i + "end'>Endzeit</label><input id='p" + i + "end' type='time' value=''><div class='small'>Leer lassen = arbeitet bis Fertigzeit.</div><div id='p" + i + "note' class='note'></div></div>" +
          "<div class='pauseBlock'><div class='pauseTitle'>Pause Person " + i + "</div>" +
          "<div class='row'><label for='p" + i + "pauseStart'>Anfang Pause</label><input id='p" + i + "pauseStart' type='time' value=''></div>" +
          "<div class='row'><label for='p" + i + "pauseDur'>Pausendauer in Minuten</label><input id='p" + i + "pauseDur' type='number' inputmode='numeric' min='0' value='' placeholder='z. B. 30'><div class='small'>Leer lassen = keine Pause.</div></div></div>" +
          "<div id='p" + i + "dec' class='decimal'>Arbeitszeit: -<br>Pause: -<br>Anwesenheit inkl. Pause: -</div>";
        box.appendChild(div);
      }
    }

    function num(value) { return Number(String(value || "").replace(",", ".")); }
    function timeToMin(value) {
      if (!value) return null;
      var p = value.split(":");
      return Number(p[0]) * 60 + Number(p[1]);
    }
    function minToTime(minutes) {
      minutes = Math.round(minutes);
      var day = 24 * 60;
      minutes = ((minutes % day) + day) % day;
      var h = Math.floor(minutes / 60);
      var m = minutes % 60;
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }
    function hoursText(hours) { return hours.toFixed(2).replace(".", ",") + " h"; }
    function durationText(minutes) {
      minutes = Math.round(minutes);
      var h = Math.floor(minutes / 60);
      var m = minutes % 60;
      if (h === 0) return m + " Min";
      if (m === 0) return h + " Std";
      return h + " Std " + m + " Min";
    }
    function minText(minutes) { return Math.round(minutes) + " min"; }

    function reset() {
      document.getElementById("error").style.display = "none";
      document.getElementById("result").style.display = "none";
      document.getElementById("calcBox").style.display = "none";
      document.getElementById("steps").innerHTML = "";
      for (var i = 1; i <= 4; i++) {
        document.getElementById("p" + i + "note").textContent = "";
        document.getElementById("p" + i + "dec").innerHTML = "Arbeitszeit: -<br>Pause: -<br>Anwesenheit inkl. Pause: -";
      }
    }
    function showError(text) {
      var e = document.getElementById("error");
      e.textContent = text;
      e.style.display = "block";
    }
    function isPersonActive(p, minute) {
      var endLimit = p.fixedEnd === null ? Infinity : p.fixedEnd;
      if (!(p.start <= minute && minute < endLimit)) return false;
      if (p.pauseStart !== null && p.pauseEnd !== null) {
        if (p.pauseStart <= minute && minute < p.pauseEnd) return false;
      }
      return true;
    }
    function getNextChange(people, current) {
      var times = [];
      people.forEach(function(p) {
        if (p.start > current) times.push(p.start);
        if (p.fixedEnd !== null && p.fixedEnd > current) times.push(p.fixedEnd);
        if (p.pauseStart !== null && p.pauseStart > current) times.push(p.pauseStart);
        if (p.pauseEnd !== null && p.pauseEnd > current) times.push(p.pauseEnd);
      });
      if (times.length === 0) return Infinity;
      return Math.min.apply(null, times);
    }

    function calculate() {
      reset();
      var auftragHours = num(document.getElementById("auftrag").value);
      var stueck = Number(document.getElementById("stueck").value || 0);

      if (!auftragHours || auftragHours <= 0) {
        showError("Bitte eine gültige Auftragszeit eingeben, z. B. 3,55.");
        return;
      }

      var required = auftragHours * 60;
      var people = [];
      var personWork = {1:0, 2:0, 3:0, 4:0};
      var personPauseUsed = {1:0, 2:0, 3:0, 4:0};

      for (var i = 1; i <= 4; i++) {
        var startVal = document.getElementById("p" + i + "start").value;
        var endVal = document.getElementById("p" + i + "end").value;
        var pauseStartVal = document.getElementById("p" + i + "pauseStart").value;
        var pauseDurVal = document.getElementById("p" + i + "pauseDur").value;
        var pauseDur = pauseDurVal === "" ? 0 : Number(pauseDurVal);

        if (!startVal && endVal) { showError("Bei Person " + i + " ist eine Endzeit eingetragen, aber keine Startzeit."); return; }
        if (!startVal && (pauseStartVal || pauseDur > 0)) { showError("Bei Person " + i + " ist eine Pause eingetragen, aber keine Startzeit."); return; }
        if (pauseDur < 0) { showError("Die Pausendauer bei Person " + i + " darf nicht negativ sein."); return; }
        if (pauseDur > 0 && !pauseStartVal) { showError("Bitte bei Person " + i + " auch den Anfang der Pause eintragen."); return; }
        if (pauseStartVal && pauseDur <= 0) { showError("Bitte bei Person " + i + " auch die Pausendauer eintragen."); return; }

        if (startVal) {
          var start = timeToMin(startVal);
          var end = timeToMin(endVal);
          var pauseStart = timeToMin(pauseStartVal);
          var pauseEnd = null;

          if (end !== null && end <= start) end += 24 * 60;
          if (pauseStart !== null) {
            if (pauseStart < start) pauseStart += 24 * 60;
            pauseEnd = pauseStart + pauseDur;
            if (end !== null && pauseStart >= end) { showError("Die Pause bei Person " + i + " beginnt nach der Endzeit. Bitte prüfen."); return; }
          }

          people.push({ index: i, start: start, fixedEnd: end, openEnd: endVal === "", pauseStart: pauseStart, pauseEnd: pauseEnd });
        }
      }

      if (people.length === 0) { showError("Bitte mindestens eine Startzeit eintragen."); return; }
      if (!people.some(function(p) { return p.openEnd; })) { showError("Mindestens eine Endzeit muss leer bleiben, damit die Fertigzeit berechnet werden kann."); return; }

      people.sort(function(a,b) { return a.start - b.start; });
      var firstStart = Math.min.apply(null, people.map(function(p) { return p.start; }));
      var current = firstStart;
      var done = 0;
      var steps = [];

      for (var guard = 0; guard < 20000; guard++) {
        var active = people.filter(function(p) { return isPersonActive(p, current); });

        if (active.length === 0) {
          var nextChange = getNextChange(people, current);
          if (nextChange === Infinity) { showError("Es arbeitet niemand mehr, bevor der Auftrag fertig ist. Bitte Zeiten oder Pausen prüfen."); return; }
          current = nextChange;
          continue;
        }

        var next = getNextChange(people, current);
        var rate = active.length;
        var remaining = required - done;
        var neededRealTime = remaining / rate;

        if (current + neededRealTime <= next) {
          var finish = current + neededRealTime;
          var segment = finish - current;

          active.forEach(function(p) { personWork[p.index] += segment; });
          steps.push({ from: current, to: finish, active: active.map(function(p) { return p.index; }).join(", "), real: segment, work: segment * rate });

          people.forEach(function(p) {
            if (p.pauseStart !== null && p.pauseEnd !== null) {
              var overlapStart = Math.max(p.pauseStart, p.start);
              var overlapEnd = Math.min(p.pauseEnd, finish);
              if (p.fixedEnd !== null) overlapEnd = Math.min(overlapEnd, p.fixedEnd);
              if (overlapEnd > overlapStart) personPauseUsed[p.index] = overlapEnd - overlapStart;
            }
          });

          var totalDuration = finish - firstStart;
          var result = document.getElementById("result");
          result.innerHTML = "Fertig um " + minToTime(finish) + " Uhr<br><span style='font-size:16px;'>Gesamtdauer: " + durationText(totalDuration) + " (" + hoursText(totalDuration / 60) + ")</span>";
          result.style.display = "block";

          people.forEach(function(p) {
            if (p.openEnd) document.getElementById("p" + p.index + "note").textContent = "Berechnetes Ende: " + minToTime(finish) + " Uhr";
          });

          for (var j = 1; j <= 4; j++) {
            document.getElementById("p" + j + "dec").innerHTML =
              "Arbeitszeit: " + hoursText(personWork[j] / 60) + " = " + durationText(personWork[j]) +
              "<br>Pause: " + minText(personPauseUsed[j]) + " = " + durationText(personPauseUsed[j]) +
              "<br>Anwesenheit inkl. Pause: " + hoursText((personWork[j] + personPauseUsed[j]) / 60) + " = " + durationText(personWork[j] + personPauseUsed[j]);
          }

          var stepsBox = document.getElementById("steps");
          var head = document.createElement("div");
          head.className = "step";
          var perPiece = stueck > 0 ? "<br>Zeit pro Stück: <strong>" + hoursText(auftragHours / stueck) + " = " + durationText(required / stueck) + "</strong>" : "";
          head.innerHTML =
            "Auftragszeit gesamt: <strong>" + hoursText(auftragHours) + " = " + durationText(required) + "</strong>" +
            perPiece +
            "<br>Gesamtdauer von Start bis Fertig: <strong>" + durationText(totalDuration) + " = " + hoursText(totalDuration / 60) + "</strong>" +
            "<br>Pausen zählen nicht als Arbeitsleistung und verschieben dadurch die Fertigzeit.";
          stepsBox.appendChild(head);

          steps.forEach(function(s) {
            var div = document.createElement("div");
            div.className = "step";
            div.innerHTML =
              "<strong>" + minToTime(s.from) + " bis " + minToTime(s.to) + "</strong>" +
              "Person(en) aktiv: " + s.active + "<br>" +
              "Echte Zeit: " + durationText(s.real) + " (" + minText(s.real) + ")<br>" +
              "Arbeitsleistung: " + durationText(s.work) + " = " + hoursText(s.work / 60);
            stepsBox.appendChild(div);
          });

          document.getElementById("calcBox").style.display = "block";
          return;
        }

        var fixedSegment = next - current;
        active.forEach(function(p) { personWork[p.index] += fixedSegment; });
        done += fixedSegment * rate;
        steps.push({ from: current, to: next, active: active.map(function(p) { return p.index; }).join(", "), real: fixedSegment, work: fixedSegment * rate });
        current = next;
      }

      showError("Berechnung abgebrochen. Bitte Eingaben prüfen.");
    }

    document.addEventListener("DOMContentLoaded", function() {
      buildPeople();
      var btn = document.getElementById("calcBtn");
      btn.addEventListener("click", calculate);
      btn.addEventListener("touchend", function(e) { e.preventDefault(); calculate(); }, { passive: false });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(function() {});
      }
    });
  </script>
</body>
</html>
